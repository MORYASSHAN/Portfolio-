<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shaan | Vegas After Dark</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Oswald:wght@500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="stage">
    <canvas id="scene"></canvas>
    <div id="fx"></div>
  </div>
  <div id="reticle" aria-hidden="true">
    <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <circle cx="20" cy="20" r="9" />
      <path d="M20 2 v8 M20 30 v8 M2 20 h8 M30 20 h8" />
      <circle cx="20" cy="20" r="1.4" fill="currentColor" stroke="none" />
    </svg>
  </div>

  <div id="hud">
    <div class="hud-objective" id="hud-objective"></div>
    <div class="hud-song" id="hud-song"></div>
    <div class="hud-ammo" id="hud-ammo"></div>
    <div class="hud-toast" id="hud-toast"></div>
    <div class="hud-action" id="hud-action"></div>
  </div>

  <section id="intro">
    <div class="stage">
      <img class="host" src="/assets/host.png" alt="" />
      <div class="side">
        <div class="chat" id="chat"></div>
        <div class="actions" id="actions"></div>
      </div>
    </div>
  </section>

  <canvas id="finale" hidden></canvas>
  <video id="finale-video" muted loop playsinline preload="none"></video>
  <div id="story" aria-live="polite"></div>
  <div id="story-count" aria-hidden="true"></div>
  <div id="finale-hint" aria-hidden="true"><span class="mouse"><i></i></span><span>Scroll</span></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
